plugins {
    id 'java'
    id 'eclipse'
    id 'io.quarkus'
    id 'com.diffplug.spotless' version '8.10.3'
    id 'org.openapi.generator' version '7.17.0'
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")
    implementation 'io.quarkus:quarkus-rest'
    implementation 'io.quarkus:quarkus-rest-jackson'
    implementation 'io.quarkiverse.quinoa:quarkus-quinoa:2.9.2'
    implementation 'io.quarkus:quarkus-smallrye-graphql'
    implementation 'io.quarkus:quarkus-smallrye-openapi'
    implementation 'io.quarkus:quarkus-arc'
    implementation 'io.quarkus:quarkus-jdbc-postgresql'
    implementation 'io.quarkus:quarkus-jdbc-h2'
    implementation 'io.quarkus:quarkus-hibernate-orm'
    implementation 'io.quarkus:quarkus-liquibase'
    implementation 'io.quarkus:quarkus-scheduler'
    implementation 'io.quarkus:quarkus-oidc'
    implementation 'io.quarkus:quarkus-smallrye-health'
    implementation 'io.quarkus:quarkus-reactive-routes'
    implementation 'com.microsoft.azure:msal4j:1.19.1'
    testImplementation 'io.quarkus:quarkus-junit'
    testImplementation 'io.rest-assured:rest-assured'
    testImplementation 'io.quarkus:quarkus-junit-mockito'
    testImplementation 'io.smallrye:smallrye-jwt-build'
}

group = 'cloud.heiss'
version = providers.gradleProperty('releaseVersion').getOrElse('1.0.0-SNAPSHOT')

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

spotless {
    java {
        lineEndings = 'UNIX'
        target 'src/*/java/**/*.java'
        eclipse('4.37').configFile('etc/java_code_format.xml')
    }
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

compileTestJava {
    options.encoding = 'UTF-8'
}

tasks.register('genApi', org.openapitools.generator.gradle.plugin.tasks.GenerateTask) {
    generatorName = 'jaxrs-spec'
    inputSpec = file('../openapi.yaml').toURI().toString()
    outputDir = layout.buildDirectory.dir('generated/openapi').get().asFile.absolutePath
    apiPackage = 'cloud.heiss.dashboard.api'
    modelPackage = 'cloud.heiss.dashboard.api.model'
    generateApiTests = false
    generateModelTests = false
    generateApiDocumentation = false
    generateModelDocumentation = false
    cleanupOutput = true
    globalProperties = [apis: '', models: '']
    configOptions = [
        interfaceOnly: 'true',
        useJakartaEe: 'true',
        useSwaggerAnnotations: 'false',
        useBeanValidation: 'false',
        useTags: 'true',
        returnResponse: 'true',
        dateLibrary: 'java8',
        hideGenerationTimestamp: 'true'
    ]
}

sourceSets.main.java.srcDir(layout.buildDirectory.dir('generated/openapi/src/gen/java'))

eclipse {
    jdt {
        file {
            withProperties { properties ->
                def profiles = new groovy.xml.XmlSlurper().parse(rootProject.file('etc/java_code_format.xml'))
                def profile = profiles.profile.find { it.@name.text() == 'Dashboard' }
                if (profile.isEmpty()) {
                    throw new GradleException('Dashboard formatter profile not found')
                }
                profile.setting.each { setting ->
                    properties.setProperty(setting.@id.text(), setting.@value.text())
                }
            }
        }
    }
    classpath {
        file {
            whenMerged { classpath ->
                classpath.entries.findAll { entry ->
                    entry.kind == 'src' && entry.path.startsWith('build/generated/')
                }.each { entry ->
                    entry.entryAttributes['ignore_optional_problems'] = 'true'
                }
            }
        }
    }
}

tasks.register('eclipseResourcePreferences', WriteProperties) {
    group = 'ide'
    description = 'Sets the Eclipse project text encoding to UTF-8.'
    destinationFile = layout.projectDirectory.file('.settings/org.eclipse.core.resources.prefs')
    property('eclipse.preferences.version', '1')
    property('encoding/<project>', 'UTF-8')
}

tasks.named('eclipseProject') {
    dependsOn tasks.named('eclipseResourcePreferences')
}

tasks.register('eclipseFormatterPreferences', WriteProperties) {
    group = 'ide'
    description = 'Writes the Eclipse formatter profile name and version.'
    inputs.file('etc/java_code_format.xml')
    destinationFile = layout.projectDirectory.file('.settings/org.eclipse.jdt.ui.prefs')
    property('eclipse.preferences.version', '1')
    property('formatter_profile', '_Dashboard')
    property('formatter_settings_version', providers.provider {
        def profiles = new groovy.xml.XmlSlurper().parse(rootProject.file('etc/java_code_format.xml'))
        profiles.profile.find { it.@name.text() == 'Dashboard' }.@version.text()
    })
}

tasks.named('eclipseJdt') {
    dependsOn tasks.named('eclipseFormatterPreferences')
    inputs.file('etc/java_code_format.xml')
}

tasks.named('compileJava') {
    dependsOn tasks.named('genApi')
}

def openApiResources = layout.buildDirectory.dir('generated/openapi-resources')

tasks.register('copyOpenApiSpec', Sync) {
    from('../openapi.yaml')
    into(openApiResources.map { it.dir('META-INF') })
}

sourceSets.main.resources.srcDir(openApiResources)

tasks.named('processResources') {
    dependsOn tasks.named('copyOpenApiSpec')
}

tasks.register('prepareDevConfig') {
    group = 'quarkus'
    description = 'Creates missing backend and UI development configuration from sample files.'
    def configs = [
        [source: file('../config/application-dev.properties.sample'), target: file('dev/config/application.properties')],
        [source: file('../ui/src/proxy/proxy.dev.sample.json'), target: file('../ui/src/proxy/proxy.dev.json')]
    ]
    inputs.files(configs.collect { it.source })
    doLast {
        configs.each { config ->
            def target = config.target.toPath()
            if (!java.nio.file.Files.exists(target)) {
                java.nio.file.Files.createDirectories(target.parent)
                java.nio.file.Files.copy(config.source.toPath(), target)
                logger.lifecycle('Created {}', config.target)
            }
        }
    }
}

tasks.named('quarkusDev') {
    dependsOn tasks.named('prepareDevConfig')
    jvmArgs = (jvmArgs ?: []) + [
        "-Dquarkus.config.locations=${file('dev/config/application.properties').toURI()}",
        '-Dquarkus.profile=dev,h2',
        '-Dquarkus.quinoa=false'
    ]
}

tasks.register('distributionZip', Zip) {
    group = 'distribution'
    description = 'Archives the ready-to-run Quarkus application and deployment instructions.'
    dependsOn tasks.named('quarkusBuild')
    archiveBaseName = 'dashboard'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from(layout.buildDirectory.dir('quarkus-app')) {
        into 'quarkus-app'
    }
    from('../README.md')
    from('../docs/images') {
        into 'docs/images'
    }
    from('README.md') {
        rename { 'BACKEND.md' }
    }
    from('../config/application.properties.sample') {
        into 'examples'
        rename { 'application.properties' }
    }
}

pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        mavenLocal()
    }
    plugins {
        def versions = new Properties()
        file('versions.properties').withInputStream { versions.load(it) }
        id "${quarkusPluginId}" version "${versions.getProperty('quarkusPluginVersion')}"
        id 'com.diffplug.spotless' version "${versions.getProperty('spotlessPluginVersion')}"
        id 'org.openapi.generator' version "${versions.getProperty('openapiGeneratorPluginVersion')}"
    }
}
rootProject.name='server'

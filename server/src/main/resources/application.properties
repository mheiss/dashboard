# Dashboard
dashboard.media-directory=${DASHBOARD_MEDIA_DIRECTORY:./data/media}
dashboard.microsoft.client-id=${MICROSOFT_CLIENT_ID:}
dashboard.microsoft.client-secret=${MICROSOFT_CLIENT_SECRET:}
dashboard.microsoft.redirect-uri=${MICROSOFT_REDIRECT_URI:http://localhost:8080/api/accounts/callback}
dashboard.microsoft.webhook-url=${MICROSOFT_WEBHOOK_URL:}
dashboard.original-cache-bytes=${DASHBOARD_ORIGINAL_CACHE_BYTES:10737418240}
dashboard.proxy.openhab-url=${DASHBOARD_OPENHAB_URL:}
dashboard.proxy.openhab-token=${DASHBOARD_OPENHAB_TOKEN:}
dashboard.proxy.go2rtc-url=${DASHBOARD_GO2RTC_URL:}
dashboard.sync.every=5m
dashboard.thumbnail-cache-bytes=${DASHBOARD_THUMBNAIL_CACHE_BYTES:1073741824}
dashboard.token-key=${DASHBOARD_TOKEN_KEY:}
dashboard.ui-base-path=${DASHBOARD_UI_BASE_PATH:/}
dashboard.ui-config-file=${DASHBOARD_UI_CONFIG_FILE:config/config.json}
dashboard.zone=Europe/Vienna

# Database Configuration
quarkus.datasource.jdbc.url=${DASHBOARD_DB_URL}
quarkus.datasource.db-kind=postgresql
quarkus.datasource.password=${DASHBOARD_DB_PASSWORD:dashboard}
quarkus.datasource.username=${DASHBOARD_DB_USER:dashboard}
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.liquibase.change-log=db/changelog.xml
quarkus.liquibase.migrate-at-start=true

# OpenID Connect
quarkus.oidc.auth-server-url=${DASHBOARD_OIDC_ISSUER:https://localhost:8443/realms/dashboard}
quarkus.oidc.client-id=dashboard
quarkus.oidc.application-type=service
quarkus.oidc.token.audience=${DASHBOARD_OIDC_AUDIENCE:dashboard}
quarkus.oidc.token.principal-claim=preferred_username
quarkus.oidc.token.allow-jwt-introspection=false
quarkus.oidc.token.allow-opaque-token-introspection=false
quarkus.oidc.roles.role-claim-path=resource_access/dashboard/roles
quarkus.oidc.devservices.enabled=false

# Quarkus HTTP Configuration
quarkus.http.auth.permission.api-docs.paths=/q/openapi,/q/openapi/*,/q/swagger-ui,/q/swagger-ui/*
quarkus.http.auth.permission.api-docs.policy=api-docs
quarkus.http.auth.policy.api-docs.roles-allowed=admin
quarkus.http.auth.permission.dashboard-read.paths=/api/graphql,/api/graphql/*,/api/media/*
quarkus.http.auth.permission.dashboard-read.policy=permit
quarkus.http.auth.permission.dashboard.paths=/api/accounts,/api/accounts/*
quarkus.http.auth.permission.dashboard.policy=authenticated
quarkus.http.auth.permission.microsoft-callback.paths=/api/accounts/callback
quarkus.http.auth.permission.microsoft-callback.policy=permit
quarkus.http.auth.permission.ui-config.paths=/api/config
quarkus.http.auth.permission.ui-config.policy=permit
quarkus.http.auth.permission.webhooks.paths=/api/graph/webhook
quarkus.http.auth.permission.webhooks.policy=permit
quarkus.http.limits.max-body-size=1M

# Quarkus Webserver
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.ignored-path-prefixes=/api
quarkus.quinoa.package-manager-command.build=run build -- --base-href /
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.package-manager-install.node-version=24.16.0
quarkus.quinoa.ui-dir=../ui
quarkus.quinoa.ui-root-path=/

# OpenAPI contract is packaged from the repository-root openapi.yaml.
mp.openapi.scan.disable=true

# Quarkus GraphQL Configuration
quarkus.smallrye-graphql.error-extension-fields=code
quarkus.smallrye-graphql.root-path=/api/graphql
quarkus.smallrye-graphql.instrumentation-query-complexity=5000
quarkus.smallrye-graphql.instrumentation-query-depth=8
quarkus.smallrye-graphql.websocket-subprotocols=graphql-transport-ws

# Test
%test.dashboard.token-key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
%test.dashboard.ui-config-file=examples/config.sample.json
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:dashboard;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.password=sa
%test.quarkus.datasource.username=sa
%test.quarkus.scheduler.enabled=false

<app-popup title="Kalender hinzufügen">
  <div class="p-4 sm:p-5">
    <p class="mt-0 mb-3 text-sm text-(--muted)">Verfügbare Kalender für {{ data.account.name }}.</p>

    @if (error()) {
      <p role="alert" class="mt-3 mb-0 text-sm text-[#a52b3d]">{{ error() }}</p>
    } @else if (loading()) {
      <p class="mt-3 mb-0 text-sm text-(--muted)" role="status">Kalender werden geladen …</p>
    } @else {
      <div class="max-h-72 overflow-y-auto rounded-lg border border-(--line)">
        @for (calendar of calendars(); track calendar.id) {
          <div class="flex items-center gap-3 border-b border-(--line) p-2 last:border-b-0">
            <p class="m-0 min-w-0 flex-1 truncate px-2 py-2 text-sm" [title]="calendar.name">{{ calendar.name }}</p>
            <button
              type="button"
              class="inline-flex min-h-10 shrink-0 items-center gap-1 rounded-lg border border-(--accent) bg-(--accent) px-3 py-2 text-xs font-semibold text-white disabled:opacity-50"
              (click)="addCalendar(calendar)"
              [disabled]="adding()"
            >
              <svg lucidePlus aria-hidden="true" class="size-4"></svg>
              {{ adding() ? 'Wird hinzugefügt …' : 'Hinzufügen' }}
            </button>
          </div>
        } @empty {
          <p class="m-0 p-3 text-sm text-(--muted)">Alle verfügbaren Kalender wurden bereits hinzugefügt.</p>
        }
      </div>
    }
  </div>
</app-popup>

<div class="relative h-full min-h-0 w-full bg-black">
  @if (data.kind === 'video') {
    <video
      #zoomElement
      class="h-full w-full object-contain"
      [srcObject]="data.stream()"
      [poster]="data.poster()"
      autoplay
      muted
      playsinline
    ></video>
  } @else {
    <img #zoomElement class="h-full w-full object-contain" [attr.src]="data.imageUrl()" alt="" />
  }
  @if (data.statusText(); as text) {
    <div class="pointer-events-none absolute inset-0 z-10 flex items-center justify-center">
      <span class="rounded bg-black/60 px-3 py-1.5 text-sm font-medium text-white">{{ text }}</span>
    </div>
  }
  <button
    type="button"
    aria-label="Close full-screen stream"
    title="Close"
    class="absolute top-3 right-3 z-10 flex h-11 w-11 items-center justify-center rounded-full bg-black/65 text-white hover:bg-white/15 focus-visible:outline-2 focus-visible:outline-white"
    (click)="dialogRef.close()"
  >
    <svg lucideX class="h-6 w-6" aria-hidden="true"></svg>
  </button>
</div>

<div [class]="fit() ? 'relative h-full w-full overflow-hidden' : 'relative w-full'">
  <video
    #videoElement
    [class]="fit() ? 'block h-full w-full bg-black object-contain' : 'block aspect-3/2 w-full rounded-md bg-black object-contain'"
    [srcObject]="video()"
    [poster]="poster()"
    muted
    autoplay
  ></video>
  @if (statusText(); as text) {
    <div class="absolute top-2 left-2 rounded bg-black/35 px-1.5 py-0.5 text-[10px] font-medium tracking-wide text-white/75 backdrop-blur-sm">{{ text }}</div>
  }
  <div class="absolute top-2 right-2" (click)="showStats.set(!showStats())">
    <div [classList]="classes()"></div>
  </div>
  @if (showStats()) {
    <div class="absolute bottom-2 left-2 text-xs text-white">{{ stats() }}</div>
  }
</div>

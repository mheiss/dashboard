<div [class]="fit() ? 'relative h-full w-full overflow-hidden' : 'relative w-full'">
  <video
    #videoElement
    [class]="fit() ? 'block h-full w-full bg-black object-contain' : 'block aspect-3/2 w-full rounded-md bg-black object-contain'"
    [srcObject]="video()"
    [poster]="poster()"
    muted
    autoplay
    playsinline
    aria-label="Open full-screen stream"
    (click)="openMobileViewer()"
  ></video>
  @if (statusText(); as text) {
    <div
      class="absolute top-2 left-2 rounded bg-black/35 px-1.5 py-0.5 text-[10px] font-medium tracking-wide text-white/75 backdrop-blur-sm"
    >
      {{ text }}
    </div>
  }
  @if (label(); as name) {
    <div class="pointer-events-none absolute right-0 bottom-0 left-0 flex items-center gap-1.5 bg-black/65 px-2 py-1 text-xs text-white">
      <div class="h-2 w-2 shrink-0 rounded-full" [class]="classes()"></div>
      <span class="min-w-0 truncate">{{ name }}</span>
      @if (mode(); as text) {
        <span class="ml-auto shrink-0 text-[10px] font-medium tracking-wide text-white/75">{{ text }}</span>
      }
    </div>
  } @else {
    <div class="absolute top-2 right-2 z-20 flex items-center gap-1.5">
      @if (mode(); as text) {
        <span class="pointer-events-none rounded bg-black/35 px-1 text-[10px] leading-4 font-medium tracking-wide text-white/75 backdrop-blur-sm">
          {{ text }}
        </span>
      }
      <button
        type="button"
        class="flex h-4 w-4 items-center justify-center"
        aria-label="Stream diagnostics"
        title="Stream diagnostics"
        [attr.aria-pressed]="showStats()"
        (click)="showStats.set(!showStats())"
      >
        <div class="h-1 w-1 rounded-full" [class]="classes()"></div>
      </button>
    </div>
  }
  @if (showStats()) {
    <div
      class="absolute bottom-2 left-2 z-10 max-h-[calc(100%-2.5rem)] max-w-[calc(100%-1rem)] overflow-y-auto rounded bg-black/75 p-2 text-[10px] wrap-break-word whitespace-pre-line text-white"
    >
      {{ stats() }}
    </div>
  }
</div>

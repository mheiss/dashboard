<div class="navigation-links">
  @for (item of elements(); track item.path) {
    <a
      [routerLink]="item.path"
      [attr.aria-label]="item.name"
      [attr.aria-current]="highlightedPath() === item.path ? 'page' : null"
      [title]="item.name"
      class="navigation-link"
      [class.is-active]="highlightedPath() === item.path"
      (mouseover)="item.hover.set(true)"
      (mouseleave)="item.hover.set(false)"
    >
      @if (item.path === '/calendar') {
        <svg lucideCalendarDays aria-hidden="true"></svg>
      } @else if (item.path === '/gallery') {
        <svg lucideImages aria-hidden="true"></svg>
      } @else if (item.path === '/home') {
        <svg lucideHouse aria-hidden="true"></svg>
      } @else if (item.path === '/openhab') {
        <svg lucidePanelsTopLeft aria-hidden="true"></svg>
      } @else if (item.path === '/evcc') {
        <svg lucideZap aria-hidden="true"></svg>
      } @else {
        <svg lucideCctv aria-hidden="true"></svg>
      }
      <span>{{ item.name }}</span>
    </a>
  }
  <a routerLink="/setup" class="navigation-link" title="Einstellungen" aria-label="Einstellungen" [class.is-active]="activePath() === '/setup'">
    <svg lucideSettings aria-hidden="true"></svg><span class="max-sm:sr-only">Einstellungen</span>
  </a>
</div>

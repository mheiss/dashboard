<div class="home-layout">
  @if (!layout.mobile$() || routeData()['mobileView'] !== 'gallery') {
    <section class="home-calendar" aria-label="Kalender">
      <app-calendar class="block h-full min-h-0" />
    </section>
  }
  @if (!layout.mobile$() || routeData()['mobileView'] === 'gallery') {
    <section class="home-gallery" aria-label="Fotogalerie">
      <app-gallery class="block h-full min-h-0" />
    </section>
  }
</div>

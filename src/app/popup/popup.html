<div class="popup-surface">
  <header class="popup-heading">
    <div class="min-w-0">
      @if (title()) {
        <h2>{{ title() }}</h2>
      }
    </div>
    @if (!data.disableClose) {
      <button type="button" (click)="close()" class="popup-close" title="Schließen" aria-label="Schließen">
        <svg lucideX aria-hidden="true"></svg>
      </button>
    }
  </header>
  <div class="popup-content">
    <ng-content />
  </div>
</div>

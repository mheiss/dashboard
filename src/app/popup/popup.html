<div class="flex h-full min-h-[250px] w-full flex-col rounded-xl bg-white">
  <div class="p-3">
    <h2 class="text-xl font-semibold">{{ title() }}</h2>
  </div>

  <div class="mb-6 h-full flex-1 px-3 text-gray-600">
    <ng-content />
  </div>

  <div class="flex justify-end gap-3 rounded-b-xl bg-navigation p-4">
    <button (click)="onCancel()" class="rounded-md bg-secondary px-4 py-2 transition hover:bg-secondary-2">Cancel</button>
    <button (click)="onConfirm()" class="rounded-md bg-primary px-4 py-2 text-white transition hover:bg-primary-2">Confirm</button>
  </div>
</div>

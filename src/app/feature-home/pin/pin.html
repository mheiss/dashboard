<app-popup title="PIN eingeben">
  <div class="pin-content">
    <div class="pin-indicators" role="status" aria-label="PIN-Eingabe">
      @for (value of values(); track $index) {
        <div
          class="pin-indicator"
          [ngClass]="{
            'is-filled': value,
            'opacity-50': value && isVerifying(),
            'animate-slide-and-fade bg-rose-700': value && isInvalid(),
          }"
        ></div>
      }
    </div>
    <div class="pin-keypad">
      @for (key of keys(); track key) {
        <div [ngClass]="key.position">
          <button
            type="button"
            (click)="keyPressed(key)"
            class="pin-key"
            [disabled]="isVerifying()"
            [attr.aria-label]="key.icon ? 'Letzte Ziffer löschen' : key.text"
          >
            @if (key.icon) {
              <svg lucideDelete aria-hidden="true"></svg>
            } @else {
              {{ key.text }}
            }
          </button>
        </div>
      }
    </div>
  </div>
</app-popup>

<div
  class="grid h-full"
  [ngClass]="{
    'grid-cols-[45px_repeat(1,minmax(0,1fr))]': events().length === 1,
    'grid-cols-[45px_repeat(2,minmax(0,1fr))]': events().length === 2,
    'grid-cols-[45px_repeat(3,minmax(0,1fr))]': events().length === 3,
    'grid-cols-[45px_repeat(4,minmax(0,1fr))]': events().length === 4,
    'grid-cols-[45px_repeat(5,minmax(0,1fr))]': events().length === 5,
    'grid-cols-[45px_repeat(6,minmax(0,1fr))]': events().length === 6,
    'grid-cols-[45px_repeat(7,minmax(0,1fr))]': events().length === 7,
  }"
>
  <div class="border-r bg-gray-50 px-2 py-1"></div>
  @for (dayEvents of agendaEvents(); track $index) {
    <div class="border-r bg-white">
      <div class="mt-2">
        @for (event of dayEvents; track event.id) {
          <div
            class="m-1 min-h-14 overflow-hidden rounded border border-b border-l-8 border-blue-300 bg-blue-100 px-2 py-1 text-xs"
            [ngClass]="event.tailwindClasses"
          >
            <div class="text-base font-bold">
              {{ event.subject }}
            </div>
            <div class="mt-2 text-sm text-stone-500">{{ event.start | date: 'HH:mm' }} - {{ event.end | date: 'HH:mm' }}</div>
          </div>
        }
      </div>
    </div>
  }
</div>

<div class="grid h-full min-h-0 w-full grid-cols-1 gap-3 bg-gray-100 p-2 sm:grid-cols-2 sm:p-4 lg:grid-cols-[380px_minmax(0,1fr)]">
  @if (!layout.mobile$() || routeData()['mobileView'] !== 'gallery') {
    <div class="min-h-0 min-w-0 rounded bg-white p-1">
      <app-calendar class="block h-full min-h-0" />
    </div>
  }
  @if (!layout.mobile$() || routeData()['mobileView'] === 'gallery') {
    <div class="min-h-0 min-w-0 rounded bg-white p-1">
      <app-gallery class="block h-full min-h-0" />
    </div>
  }
</div>

<div class="flex h-full min-h-0 w-full gap-4 bg-gray-100 p-4">
  <div class="flex min-h-0 w-2/5 flex-col gap-4">
    <div class="min-h-0 flex-1 rounded bg-white p-4 shadow">
      <app-calendar class="block h-full min-h-0" [events]="calendarService.events()" />
    </div>
  </div>

  <div class="flex min-h-0 w-3/5 flex-col gap-4">
    <div class="min-h-0 flex-3 rounded bg-white p-4 shadow">
      <app-gallery class="block h-full min-h-0" [images]="imageService.images()" [imageCount]="imageService.imageCount()" (loadMore)="imageService.loadMore()" />
    </div>
  </div>
</div>

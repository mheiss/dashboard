@if (layout.mobile$()) {
  <div class="p-s flex w-full flex-col items-center bg-gray-200">
    <div class="drop-shadow-2x rounded-md bg-white p-4">
      @for (camera of cameras(); track camera.camera) {
        <app-video [camera]="camera.camera" [play]="camera.play" />
      }
    </div>
  </div>
} @else {
  <div class="p-l flex h-full flex-row gap-2 bg-gray-200">
    <div class="h-full w-70 overflow-auto rounded-md bg-white p-4 drop-shadow-2xl">
      <div class="flex h-full flex-col items-center">
        @for (camera of cameras(); track camera.camera) {
          <app-video [camera]="camera.camera" [play]="camera.play" [quality]="'medium'" [zoom]="false" (click)="pinned.set(camera.camera)" />
        }
      </div>
    </div>
    <div class="h-full w-[calc(100%-280px-32px)] overflow-auto rounded-md bg-white p-4 drop-shadow-2xl">
      @if (pinned(); as pinnedCamera) {
        <app-video [camera]="pinnedCamera" />
      }
    </div>
  </div>
}

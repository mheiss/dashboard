<div #container class="h-full overflow-y-scroll">
  <div class="grid h-full min-h-0 grid-cols-[45px_repeat(3,minmax(0,1fr))] grid-rows-[auto_auto_1fr] bg-gray-100 text-sm text-gray-900">
    <!-- Row 1: Date headers -->
    <div class="sticky top-0 z-20 border-r bg-gray-50 px-2 py-1 text-xs"></div>
    @for (day of days(); track $index) {
      <div class="sticky top-0 z-20 border-r bg-white px-2 py-2">
        <div
          class="text-2xl font-bold"
          [ngClass]="{
            'text-amber-600': isToday(day),
            'text-stone-500': !isToday(day),
          }"
        >
          {{ day | date: 'dd' }}
        </div>
        <div class="text-xs text-stone-500">
          {{ day | date: 'EEEE' }}
        </div>
      </div>
    }

    <!-- All-day events -->
    <div class="sticky top-16 z-20 border-r bg-gray-50 px-2 py-1 text-xs"></div>
    @for (day of days(); track $index) {
      <div class="sticky top-16 z-20 border-r bg-gray-50 px-1 py-1">
        @for (event of allDayEvents(); track event.id) {
          <div
            class="truncate rounded border border-blue-300 bg-blue-100 px-2 py-1 text-xs text-stone-900"
            [ngClass]="{
              'border-emerald-600 bg-emerald-300': event.myType === 'Familie',
              'border-fuchsia-600 bg-fuchsia-300': event.myType === 'Sarah',
            }"
          >
            {{ event.subject }}
          </div>
        }
      </div>
    }

    <!-- Events -->
    <div class="col-span-4 min-h-0 border-t-4 border-stone-300">
      <app-hour-view [eventsByDay]="eventsByDay()" />
    </div>
  </div>
</div>

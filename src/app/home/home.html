<div class="h-full w-full bg-gray-100 p-4">
  <div class="flex h-full gap-4">
    <div class="flex w-1/3 flex-col gap-4">
      <div class="rounded bg-white p-4 shadow">
        <h2 class="text-xl font-semibold">{{ greeting() }}</h2>
        <p id="datetime" class="mt-2 text-gray-600">{{ now() | date: 'dd.MM.yyyy' }} – {{ now() | date: 'HH:mm:ss' }}</p>
      </div>

      <div class="flex-1 rounded bg-white p-4 shadow">
        <h2 class="mb-3 text-xl font-semibold">Kalender</h2>
        <app-calendar [allDayEvents]="allDayEvents()" [timedEvents]="timedEvents()" />
      </div>
    </div>

    <div class="flex w-2/3 flex-col gap-4">
      <div class="flex-2 rounded bg-white p-4 shadow">
        <h2 class="mb-3 text-xl font-semibold">Bilder</h2>
        <app-gallery [images]="imageService.images()" (loadMore)="imageService.loadMore()" />
      </div>

      <div class="flex-1 rounded bg-white p-4 shadow">
        <h2 class="mb-3 text-xl font-semibold">Custom Widget</h2>
        <div class="h-full rounded bg-gray-50"></div>
      </div>
    </div>
  </div>
</div>

<div class="h-[65vh] overflow-y-auto p-2" (infiniteScroll)="loadMore.emit()">
  @if (images().length === 0) {
    <div class="text-gray-500">Lade Bilder...</div>
  }
  <div class="grid grid-cols-4 gap-1 p-2">
    @for (p of images(); track p.item.id) {
      <div class="aspect-square overflow-hidden rounded bg-gray-100">
        <img class="h-full w-full object-cover" [src]="p.thumb?.url" [alt]="p.item.name" />
      </div>
    }
  </div>
</div>

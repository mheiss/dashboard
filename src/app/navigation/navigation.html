<ul class="flex space-x-25 text-white">
  @for (item of dashboard.entries(); track item) {
  <li class="flex flex-col items-center">
    @if(item.icon.endsWith("svg")) {
      <mat-icon svgIcon="{{ item.icon }}" class="material-icons text-3xl mb-1" />
    } @else{
      <mat-icon fontIcon="{{ item.icon }}" class="material-icons text-3xl mb-1" />
    }
    <span class="text-sm">{{ item.title }}</span>
  </li>
  }
</ul>

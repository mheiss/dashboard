<div class="flex justify-center space-x-8 text-stone-300">
  @for (item of elements; track item) {
    <div
      [routerLink]="item.path"
      class="pb-1"
      (mouseover)="item.hover.set(true)"
      (mouseleave)="item.hover.set(false)"
      [ngClass]="{
        'shadow-2xs shadow-amber-500': activePath() === item.path,
      }"
    >
      <button class="flex flex-row items-center rounded-lg p-2 hover:bg-amber-600 hover:text-white">
        <img #img class="hover h-7 w-7" [src]="item.icon()" />
        <span class="hidden pl-3 text-3xl md:inline">{{ item.name }}</span>
      </button>
    </div>
  }
</div>

name: Build

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      version:
        description: Version used in the deployment archive
        type: string
        default: 1.0.0-SNAPSHOT

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      BUILD_VERSION: ${{ inputs.version || '1.0.0-SNAPSHOT' }}
      QUARKUS_QUINOA_PACKAGE_MANAGER_INSTALL: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Test frontend
        working-directory: ui
        run: npm test

      - name: Check, build, and package
        run: |
          [[ "$BUILD_VERSION" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ ]] || { echo 'Unsupported release version'; exit 1; }
          bash server/gradlew -p server --no-daemon check distributionZip "-PreleaseVersion=$BUILD_VERSION" --console=plain

      - name: Generate archive checksum
        working-directory: server/build/distributions
        run: sha256sum dashboard-*.zip > SHA256SUMS

      - name: Upload deployment package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dashboard
          path: |
            server/build/distributions/dashboard-*.zip
            server/build/distributions/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14